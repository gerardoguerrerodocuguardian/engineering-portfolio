server:
  port: ${PORT:8080}
management:
  endpoints.web.exposure.include: health,info
adflow:
  source: ${ADFLOW_SOURCE:memory}   # memory | pubsub | kafka (stub)
  sink: ${ADFLOW_SINK:memory}       # memory | duckdb | bigquery
