# Scrapes the gateway's admin-only metrics endpoint. The endpoint needs an admin JWT, so put one in
# ops/prometheus/token (git-ignored) before starting the "observability" compose profile:
#   curl -s -XPOST http://127.0.0.1:8080/dev/token -H 'content-type: application/json' -d '{"user":"root"}' | jq -r .access_token > ops/prometheus/token
# Dev tokens expire (15 min by default); a real setup uses a long-lived service identity from the IdP.
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: adflow-gateway
    metrics_path: /admin/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/token
    static_configs:
      - targets: ["gateway:8080"]
