apiVersion: v1
kind: Service
metadata:
  name: {{ include "adflow.fullname" . }}
  labels: {{- include "adflow.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP}
  selector: {{- include "adflow.selectorLabels" . | nindent 4 }}
