receivers:
  otlp:
    protocols:
      grpc: {endpoint: "0.0.0.0:4317"}
      http: {endpoint: "0.0.0.0:4318"}
processors:
  memory_limiter: {check_interval: 1s, limit_mib: 256}
  batch: {}
  resource:
    attributes:
      - {key: deployment.environment, value: local, action: upsert}
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: "0.0.0.0:8889"
service:
  pipelines:
    traces:  {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlp/tempo]}
    logs:    {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlphttp/loki]}
    metrics: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [prometheus]}
