# SLO: 99.9% availability over 30d (error budget 0.1%); 95% of requests < 300ms.
groups:
  - name: adflow-slo-burn
    rules:
      - alert: ErrorBudgetFastBurn
        expr: service:http_error_ratio:rate5m > (14.4 * 0.001) and service:http_error_ratio:rate1h > (14.4 * 0.001)
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.service }} burning 30d error budget 14.4x too fast"
          description: "Budget gone in ~2 days at this rate. Runbook: docs/runbook.md#high-error-rate"
      - alert: ErrorBudgetSlowBurn
        expr: service:http_error_ratio:rate30m > (6 * 0.001) and service:http_error_ratio:rate6h > (6 * 0.001)
        for: 15m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.service }} burning error budget 6x too fast"
          description: "Runbook: docs/runbook.md#high-error-rate"
  - name: adflow-slo-latency
    rules:
      - alert: LatencySLOViolation
        expr: |
          1 - (
            sum by (service) (rate(http_server_requests_seconds_bucket{le="0.3"}[30m]))
            / sum by (service) (rate(http_server_requests_seconds_count[30m]))
          ) > 0.05
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.service }}: more than 5% of requests slower than 300ms"
          description: "Runbook: docs/runbook.md#high-latency"
      - alert: ServiceDown
        expr: up{job=~"ad-bidding-platform|secure-api"} == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.job }} target is down"
