# Assumes Micrometer's http_server_requests_seconds_* (Spring Boot). For OTel/NestJS adjust metric names.
groups:
  - name: adflow-sli
    rules:
      - record: service:http_requests:rate5m
        expr: sum by (service) (rate(http_server_requests_seconds_count[5m]))
      - record: service:http_errors:rate5m
        expr: sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
      - record: service:http_error_ratio:rate5m
        expr: service:http_errors:rate5m / service:http_requests:rate5m
      - record: service:http_error_ratio:rate30m
        expr: sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[30m])) / sum by (service) (rate(http_server_requests_seconds_count[30m]))
      - record: service:http_error_ratio:rate1h
        expr: sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[1h])) / sum by (service) (rate(http_server_requests_seconds_count[1h]))
      - record: service:http_error_ratio:rate6h
        expr: sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[6h])) / sum by (service) (rate(http_server_requests_seconds_count[6h]))
      - record: service:http_latency_p99:5m
        expr: histogram_quantile(0.99, sum by (service, le) (rate(http_server_requests_seconds_bucket[5m])))
