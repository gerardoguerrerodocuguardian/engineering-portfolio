global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/recording-rules.yml
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: ad-bidding-platform        # Spring Boot running on the host (make run)
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["host.docker.internal:8080"], labels: {service: ad-bidding-platform}}]
  - job_name: secure-api                 # NestJS, needs /metrics (prom-client) to return data
    metrics_path: /metrics
    static_configs: [{targets: ["host.docker.internal:3000"], labels: {service: secure-api}}]
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8889"]}]
