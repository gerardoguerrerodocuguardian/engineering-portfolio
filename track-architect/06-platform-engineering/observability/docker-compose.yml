# Local observability stack. Synthetic only; no credentials beyond a local-only Grafana admin password.
name: adflow-observability
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/config.yaml
    volumes: ["./loki/config.yaml:/etc/loki/config.yaml:ro"]
    ports: ["3100:3100"]
  tempo:
    image: grafana/tempo:2.6.1
    command: -config.file=/etc/tempo/tempo.yaml
    volumes: ["./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro"]
    ports: ["3200:3200"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel/config.yaml:/etc/otelcol/config.yaml:ro"]
    ports:
      - "4317:4317"   # OTLP gRPC (point your services here)
      - "4318:4318"   # OTLP HTTP
    depends_on: [tempo, loki, prometheus]
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-only-change-me
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus, loki, tempo]
