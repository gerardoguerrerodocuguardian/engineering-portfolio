[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adflow-data-pipeline"
version = "0.1.0"
description = "Synthetic ad-event batch pipeline: validate, load (DuckDB), transform, data-quality checks, forecast, report."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "duckdb>=1.0",
  "polars>=1.0",
  "pyarrow>=15",
  "numpy>=1.26",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
adflow = "adflow_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=adflow_pipeline --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/airflow_example"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true
