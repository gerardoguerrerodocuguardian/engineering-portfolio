spring:
  application:
    name: billing-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/billing}
    username: ${DB_USER:billing}
    password: ${DB_PASSWORD:billing}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  cache:
    cache-names: taxRates
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m,recordStats
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWKS is fetched lazily on the first token; point this at your identity provider.
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9000/.well-known/jwks.json}

adflow:
  tax-client:
    base-url: ${TAX_SERVICE_URL:http://localhost:8089}
    connect-timeout: 500ms
    read-timeout: 1s
    max-attempts: 3
    retry-wait: 100ms
    breaker-window-size: 10
    breaker-minimum-calls: 5
    breaker-failure-rate-percent: 50
    breaker-open-duration: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
