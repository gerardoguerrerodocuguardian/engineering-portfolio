# Example workflow; move to .github/workflows/micro-frontends.yml at the repo root.
# Each remote is built and could be deployed by its own job; the shell only needs the manifest to change.
name: micro-frontends
on:
  workflow_dispatch:
  pull_request:
    paths: ['track-fullstack-dev/08-micro-frontends/**']
defaults:
  run:
    working-directory: track-fullstack-dev/08-micro-frontends
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: track-fullstack-dev/08-micro-frontends/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: 'true'
  # Illustrative independent deploy: only runs when the remote's own files change,
  # then flips its entry in manifest.json (deploy order: assets first, manifest last).
  deploy-reports:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: echo "upload apps/remote-reports/dist to the CDN, then update the manifest entry version/url"
