name: dotnet-api-gateway-yarp
on:
  workflow_dispatch:
  push:
    paths:
      - "track-architect/11-dotnet-api-gateway-yarp/**"
      - ".github/workflows/dotnet-api-gateway-yarp.yml"
  pull_request:
    paths:
      - "track-architect/11-dotnet-api-gateway-yarp/**"
      - ".github/workflows/dotnet-api-gateway-yarp.yml"

jobs:
  build-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: track-architect/11-dotnet-api-gateway-yarp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore AdFlow.Gateway.sln
      - name: Build (warnings are errors in src/)
        run: dotnet build AdFlow.Gateway.sln -c Release --no-restore
      - name: Test (xUnit integration tests via WebApplicationFactory)
        run: |
          set -o pipefail
          dotnet test AdFlow.Gateway.sln -c Release --no-build --logger "console;verbosity=normal" 2>&1 | tee /tmp/test.log
      - name: Surface failing tests as annotations
        if: failure()
        run: |
          grep -E "^\s+Failed |Assert\.|Expected|Actual|Error Message|Exception" /tmp/test.log | head -40 | while read -r l; do echo "::error::${l:0:300}"; done

  compose-smoke:
    needs: build-test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: track-architect/11-dotnet-api-gateway-yarp
    steps:
      - uses: actions/checkout@v4
      - name: Dev certificate
        run: ./scripts/make-dev-cert.sh
      - name: Start the stack (gateway + 2 campaign instances + reports)
        run: docker compose up -d --build
      - name: Smoke test through the gateway
        run: ./scripts/smoke.sh
      - name: Internal services are not reachable from the host
        run: |
          # Only the gateway publishes ports; the services have none.
          for svc in campaigns-1 campaigns-2 reports; do
            ports="$(docker inspect --format '{{json .NetworkSettings.Ports}}' "$(docker compose ps -q "$svc")")"
            echo "$svc ports: $ports"
            if echo "$ports" | grep -q HostPort; then echo "$svc publishes a host port"; exit 1; fi
          done
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
