name: react-native-app
on:
  workflow_dispatch:
  push:
    paths: ['track-fullstack-dev/12-react-native-app/**', 'shared/contracts/**', '.github/workflows/react-native-app.yml']
  pull_request:
    paths: ['track-fullstack-dev/12-react-native-app/**', 'shared/contracts/**', '.github/workflows/react-native-app.yml']

defaults:
  run:
    working-directory: track-fullstack-dev/12-react-native-app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: track-fullstack-dev/12-react-native-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - name: Web export (build smoke test)
        run: npm run export:web
