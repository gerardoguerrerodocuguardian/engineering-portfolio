name: python-fastapi-service
on:
  workflow_dispatch:
  push:
    paths:
      - "track-fullstack-dev/13-python-fastapi-service/**"
      - "shared/contracts/campaign-api.openapi.yaml"
      - ".github/workflows/python-fastapi-service.yml"
  pull_request:
    paths:
      - "track-fullstack-dev/13-python-fastapi-service/**"
      - "shared/contracts/campaign-api.openapi.yaml"
      - ".github/workflows/python-fastapi-service.yml"
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: track-fullstack-dev/13-python-fastapi-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: track-fullstack-dev/13-python-fastapi-service/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint + format check)
        run: ruff check . && ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Pytest (coverage gate 90%)
        run: pytest
