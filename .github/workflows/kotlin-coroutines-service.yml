name: kotlin-coroutines-service
on:
  workflow_dispatch:
  push:
    paths: ["track-fullstack-dev/11-kotlin-coroutines-service/**", ".github/workflows/kotlin-coroutines-service.yml"]
  pull_request:
    paths: ["track-fullstack-dev/11-kotlin-coroutines-service/**", ".github/workflows/kotlin-coroutines-service.yml"]
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: track-fullstack-dev/11-kotlin-coroutines-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Verify (ktlint, tests)
        run: mvn -B verify
