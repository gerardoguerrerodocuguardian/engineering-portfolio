# Move to .github/workflows/ad-bidding-platform.yml at the repository root.
name: ad-bidding-platform
on:
  workflow_dispatch:
  push:
    paths: ["track-architect/02-ad-bidding-platform/**"]
  pull_request:
    paths: ["track-architect/02-ad-bidding-platform/**"]
jobs:
  verify:
    runs-on: ubuntu-24.04   # Docker is available, so the Testcontainers IT runs
    defaults:
      run:
        working-directory: track-architect/02-ad-bidding-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify
      - name: Surface test failures as annotations
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
            [ -f "$f" ] && grep -E "FAIL|ERROR|Caused by|Exception" "$f" | head -8 | while read -r l; do echo "::error::$(basename $f): ${l:0:300}"; done
          done
      # Quality gate placeholder: add `mvn sonar:sonar` with a SONAR_TOKEN secret to enforce coverage/smells.
