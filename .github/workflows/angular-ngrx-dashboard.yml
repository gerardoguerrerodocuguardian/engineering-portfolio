# Copy to .github/workflows/ci.yml (at the repository root, adjusting working-directory).
name: angular-ngrx-dashboard
on:
  workflow_dispatch:
  push:
    paths: ['track-fullstack-dev/03-angular-ngrx-dashboard/**', 'shared/contracts/**']
  pull_request:
    paths: ['track-fullstack-dev/03-angular-ngrx-dashboard/**', 'shared/contracts/**']

defaults:
  run:
    working-directory: track-fullstack-dev/03-angular-ngrx-dashboard

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: track-fullstack-dev/03-angular-ngrx-dashboard/package-lock.json
      - run: npm ci
      - name: Contract types are up to date
        run: npm run gen:types && git diff --exit-code src/app/core/api.generated.ts
      - run: npm run test:ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: track-fullstack-dev/03-angular-ngrx-dashboard/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: track-fullstack-dev/03-angular-ngrx-dashboard/test-results
